name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg from the runner package index
        run: timeout 600s bash -c 'sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg'
      - name: Verify FFmpeg
        run: timeout 15s bash -c 'command -v ffmpeg && ffmpeg -version | head -n 1'
      - name: Install locked development environment
        run: uv sync --locked --extra dev
      - name: Verify repository maintenance contract
        run: uv run python scripts/verify_repo.py
      - name: Check formatting
        run: uv run ruff format --check scripts/verify_repo.py
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Type check
        run: uv run mypy src/video_script_reconstructor
      - name: Unit and integration tests
        run: uv run pytest tests/unit tests/integration -q

  contract:
    name: contract (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install FFmpeg from the runner package index
        run: timeout 600s bash -c 'sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg'
      - name: Verify FFmpeg
        run: timeout 15s bash -c 'command -v ffmpeg && ffmpeg -version | head -n 1'
      - name: Install locked development environment
        run: uv sync --locked --extra dev
      - name: Run mandatory acceptance suites
        run: uv run pytest tests/e2e tests/mutation tests/packaging -q

  required:
    name: required
    if: ${{ always() }}
    needs: [quality, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI gates to pass
        if: ${{ needs.quality.result != 'success' || needs.contract.result != 'success' }}
        run: |
          echo "quality=${{ needs.quality.result }}"
          echo "contract=${{ needs.contract.result }}"
          exit 1
      - run: echo "All required CI gates passed."
