name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and optionally publish
        required: true
        type: string
      publish:
        description: Publish to PyPI through the protected pypi environment
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: uv sync --locked --extra dev
      - name: Verify repository contract
        run: uv run python scripts/verify_repo.py
      - name: Verify tag and package version match
        env:
          EXPECTED_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["EXPECTED_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match project version {expected!r}")
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"release tag {tag!r} is not a stable SemVer tag")
          PY
      - name: Build distributions
        run: uv build
      - name: Validate distribution metadata
        run: uv run twine check dist/*
      - name: Install and smoke-test the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/release-venv/bin/fast-video-analyzer" --help
          "$RUNNER_TEMP/release-venv/bin/fast-video-analyzer" doctor --offline
      - name: Keep publishable packages separate from release metadata
        run: |
          mkdir -p dist/packages
          mv dist/*.whl dist/*.tar.gz dist/packages/
      - name: Export locked runtime dependencies for SBOM
        run: uv export --locked --format requirements.txt --no-emit-project --output-file "$RUNNER_TEMP/runtime-requirements.txt" > /dev/null
      - name: Generate CycloneDX runtime dependency SBOM
        run: uv run pip-audit --format cyclonedx-json --progress-spinner off --output dist/fast-video-analyzer-sbom.cdx.json -r "$RUNNER_TEMP/runtime-requirements.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  attest:
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v4.2.2
        with:
          subject-path: dist/packages/*

  github-release:
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag --generate-notes --title "$RELEASE_TAG" dist/packages/* dist/fast-video-analyzer-sbom.cdx.json

  pypi:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/packages/
