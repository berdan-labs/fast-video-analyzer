name: Dependency audit

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Audit locked environment
        run: |
          uv export --locked --extra dev --format requirements.txt --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt" > /dev/null
          uv run pip-audit --strict --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"
