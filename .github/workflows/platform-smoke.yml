name: Platform smoke

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

concurrency:
  group: platform-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: uv sync --locked --extra dev
      - name: Verify all public CLI aliases
        run: |
          uv run fast-video-analyzer --help
          uv run long-video-analyzer --help
          uv run video-script-reconstructor --help
      - name: Verify offline doctor
        run: uv run fast-video-analyzer doctor --offline
      - name: Run platform-safe CLI and continuity tests
        run: uv run pytest tests/unit/test_cli.py tests/unit/test_backup_repo.py -q
